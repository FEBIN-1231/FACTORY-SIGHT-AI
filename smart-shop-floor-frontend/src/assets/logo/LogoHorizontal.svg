<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 130" width="100%" height="100%" fill="none" aria-label="Factory Sight AI Logo Horizontal">
  <defs>
    <mask id="fs-h-factory-mask">
      <rect width="170" height="130" fill="white" />
      <path d="M 27 118 L 27 97 L 55 80 L 55 97 L 84 80 L 84 97 L 112 80 L 112 97 L 121 91 L 124 14 L 144 14 L 150 118 Z"
            fill="black" stroke="black" stroke-width="10" stroke-linejoin="round" stroke-linecap="round" />
    </mask>
  </defs>

  <!-- Left Logo Mark (scaled) -->
  <g transform="translate(0, 0)">
    <g mask="url(#fs-h-factory-mask)">
      <path d="M 10 66 C 31 27, 68 20, 93 20 C 118 20, 148 34, 167 66" 
            stroke="#FE4B4A" stroke-width="5.8" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 10 66 C 31 103, 68 112, 95 112 C 122 112, 148 98, 167 66" 
            stroke="#FE4B4A" stroke-width="5.8" stroke-linecap="round" stroke-linejoin="round" />

      <circle cx="91" cy="62" r="31" stroke="#FE4B4A" stroke-width="5.4" />

      <path d="M 91 45 A 17 17 0 1 0 108 62 A 17 17 0 0 0 91 45 Z M 98 51 A 4 4 0 1 1 94 47 A 4 4 0 0 1 98 51 Z" 
            fill="#C41E23" fill-rule="evenodd" />
    </g>

    <path d="M 27 118 L 27 97 L 55 80 L 55 97 L 84 80 L 84 97 L 112 80 L 112 97 L 121 91 L 124 14 L 144 14 L 150 118 Z"
          stroke="#F5F7FA" stroke-width="5.8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- Typography Wordmark -->
  <g transform="translate(185, 0)">
    <!-- FACTORY -->
    <text x="0" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Outfit', 'Inter', sans-serif" 
          font-size="44" font-weight="900" letter-spacing="3" fill="#F5F7FA">FACTORY</text>
    
    <!-- SIGHT -->
    <text x="2" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Outfit', 'Inter', sans-serif" 
          font-size="34" font-weight="300" letter-spacing="7.5" fill="#C7CDD4">SIGHT</text>

    <!-- AI Accent Badge -->
    <rect x="238" y="24" width="56" height="38" rx="8" fill="rgba(254, 75, 74, 0.15)" stroke="rgba(254, 75, 74, 0.35)" stroke-width="1.5" />
    <text x="266" y="51" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Outfit', 'Inter', monospace" 
          font-size="22" font-weight="900" letter-spacing="1" fill="#FE4B4A" text-anchor="middle">AI</text>
  </g>
