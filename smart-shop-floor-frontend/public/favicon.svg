<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <mask id="fs-fav-mask">
      <rect width="64" height="64" fill="white" />
      <path d="M 8 58 L 8 46 L 23 35 L 23 46 L 38 35 L 38 46 L 43 10 L 52 10 L 55 58 Z"
            fill="black" stroke="black" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" />
    </mask>
  </defs>

  <!-- Dark tile base for guaranteed contrast across dark and light browser tab chrome -->
  <rect width="64" height="64" rx="14" fill="#10141B" />

  <g mask="url(#fs-fav-mask)">
    <!-- Bold eye contour -->
    <path d="M 3 33 C 12 14, 25 10, 34 10 C 43 10, 54 18, 61 33" stroke="#FE4B4A" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 3 33 C 12 52, 25 56, 34 56 C 43 56, 54 48, 61 33" stroke="#FE4B4A" stroke-width="4.5" stroke-linecap="round" />

    <!-- Solid High-Contrast Pupil with Reflection Cutout -->
    <circle cx="33" cy="33" r="10" fill="#FE4B4A" />
    <circle cx="36" cy="30" r="2.8" fill="#10141B" />
  </g>

  <!-- Foreground Bold Factory with Chimney -->
  <path d="M 8 56 L 8 45 L 22 34 L 22 45 L 36 34 L 36 45 L 42 8 L 51 8 L 54 56 Z"
        stroke="#F5F7FA" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
</svg>